name: SPRain CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    env:
      SPRAIN_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose build api
          echo "ENVIRONMENT=testing" > .env
          echo "API_KEYS=key_admin_demo,key_operator_demo,key_viewer_demo,key_admin_express" >> .env
          echo "TENANT_API_KEYS=key_admin_demo:ADMIN:demo_corp;key_operator_demo:OPERATOR:demo_corp;key_viewer_demo:VIEWER:demo_corp;key_admin_express:ADMIN:log_express" >> .env
          echo "DB_USER=enchentes" >> .env
          echo "DB_PASSWORD=enchentes" >> .env
          echo "DB_NAME=enchentes" >> .env
          echo "GITHUB_ACTIONS=true" >> .env
          docker compose up -d db

      - name: Wait for Postgres and Bootstrap CI Database
        run: |
          docker exec sprain_db sh -c 'until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'
          for f in db/ci/*.sql; do
            docker cp "$f" sprain_db:/tmp/ci.sql
            docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d enchentes -f /tmp/ci.sql
          done

      - name: Wait for API Readiness Probe
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/readiness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/readiness

      - name: Verify running image revision
        run: |
          running_revision=$(curl -fsS -H 'X-API-Key: key_admin_demo' http://127.0.0.1:8000/api/v1/operacional/versao | python3 -c 'import json,sys; print(json.load(sys.stdin)["revisao"])')
          test "$running_revision" = "$SPRAIN_BUILD_COMMIT"

      - name: Run Full Test Suite Inside Container
        run: |
          docker exec sprain_api python -m pip install --user pytest pytest-asyncio httpx
          docker exec -w /app/api sprain_api python -m pytest tests/ -v

      - name: Verify Backup and Restore in a New CI Database
        run: |
          set -euo pipefail
          backup_dir="$(mktemp -d "${RUNNER_TEMP}/sprain-backup-XXXXXX")"
          python3 scripts/postgres_backup.py backup \
            --container sprain_db --database enchentes --user enchentes --output-dir "$backup_dir"
          python3 scripts/postgres_backup.py verify-latest \
            --database enchentes --output-dir "$backup_dir" --max-age-hours 1
          backup_file="$(find "$backup_dir" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$backup_file"
          python3 scripts/postgres_backup.py restore \
            --container sprain_db --user enchentes --new-database sprain_restore_ci --backup "$backup_file"
          source_count="$(docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d enchentes -tA -c 'SELECT count(*) FROM trechos_osm')"
          restored_count="$(docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d sprain_restore_ci -tA -c 'SELECT count(*) FROM trechos_osm')"
          test "$source_count" = "$restored_count"
          docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes -d sprain_restore_ci -tA -c 'SELECT PostGIS_Version()' | grep -q .

      - name: Verify encrypted backup round trip in disposable storage
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
          umask 077
          staging_dir="$(mktemp -d "${RUNNER_TEMP}/sprain-crypt-staging-XXXXXX")"
          encrypted_dir="$(mktemp -d "${RUNNER_TEMP}/sprain-crypt-storage-XXXXXX")"
          download_dir="$(mktemp -d "${RUNNER_TEMP}/sprain-crypt-download-XXXXXX")"
          config="$(mktemp "${RUNNER_TEMP}/sprain-rclone-XXXXXX.conf")"
          passphrase="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          obscured="$(rclone obscure "$passphrase")"
          unset passphrase
          printf '[spraincrypt]\ntype = crypt\nremote = %s\npassword = %s\nfilename_encryption = standard\ndirectory_name_encryption = true\n' \
            "$encrypted_dir" "$obscured" > "$config"
          unset obscured
          python3 scripts/backup_offsite.py run \
            --container sprain_db --database enchentes --user enchentes \
            --staging-dir "$staging_dir" --remote spraincrypt: \
            --config "$config" --allow-local-test
          run_id="$(find "$staging_dir/enchentes" -mindepth 1 -maxdepth 1 -type d -printf '%f\n')"
          test -n "$run_id"
          test "$(find "$encrypted_dir" -type f | wc -l)" -eq 2
          python3 scripts/backup_offsite.py fetch \
            --database enchentes --run-id "$run_id" \
            --download-dir "$download_dir" --remote spraincrypt: \
            --config "$config" --allow-local-test
          original="$(find "$staging_dir/enchentes/$run_id" -name '*.dump' -print -quit)"
          downloaded="$(find "$download_dir/enchentes/$run_id" -name '*.dump' -print -quit)"
          test -n "$original" && test -n "$downloaded"
          cmp "$original" "$downloaded"
          python3 scripts/postgres_backup.py restore \
            --container sprain_db --user enchentes \
            --new-database sprain_crypt_restore_ci --backup "$downloaded"
          for table in trechos_osm operacoes veiculos; do
            source_count="$(docker exec sprain_db psql -v ON_ERROR_STOP=1 \
              -U enchentes -d enchentes -tA -c "SELECT count(*) FROM $table")"
            restored_count="$(docker exec sprain_db psql -v ON_ERROR_STOP=1 \
              -U enchentes -d sprain_crypt_restore_ci -tA -c "SELECT count(*) FROM $table")"
            test "$source_count" = "$restored_count"
          done
          docker exec sprain_db psql -v ON_ERROR_STOP=1 -U enchentes \
            -d sprain_crypt_restore_ci -tA -c 'SELECT PostGIS_Version()' | grep -q .

      - name: Test Panel Session and Request Isolation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Prepare Isolated Browser Tests
        run: |
          npx playwright install --with-deps chromium
          docker compose -f compose.e2e.yml up -d --build --wait
          docker compose -f compose.e2e.yml exec -T api python /app/scripts/seed_testes_painel.py

      - name: Measure Basic Route and Risk Load
        env:
          SPRAIN_API_KEY: key_viewer_demo
        run: |
          python3 scripts/medir_carga_api.py --saida test-results/carga-api.json

      - name: Preserve Load Measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carga-api
          path: test-results/carga-api.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Test Main Panel Flows in Chromium
        run: npm run test:e2e

      - name: Preserve Browser Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Output API Logs on Failure
        if: failure()
        run: |
          docker logs sprain_api --tail 100

      - name: Shutdown Containers
        if: always()
        run: |
          docker compose -f compose.e2e.yml down
          docker compose down
